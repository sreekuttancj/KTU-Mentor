name: Android CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  env-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        run: ${ANDROID_HOME}/tools/bin/sdkmanager --install "build-tools;30.0.3"
  
  build-dev-apk:
    runs-on: ubuntu-latest
    needs: 'env-setup'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/debug/app_ktu-debug.apk
