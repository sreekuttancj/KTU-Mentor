name: Android CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  env-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download legacy Android SDK Tools
        run: |
          mkdir -p $HOME/android-sdk
          wget https://dl.google.com/android/repository/tools_r25.2.5-linux.zip -O tools_r25.2.5-linux.zip
          unzip -q tools_r25.2.5-linux.zip -d $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$PATH
          sdkmanager "platforms;android-23" "build-tools;23.0.3"
  
          
  build-dev-apk:
    runs-on: ubuntu-latest
    needs: 'env-setup'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # - name: Upload APK
      #   uses: actions/upload-artifact@v4
